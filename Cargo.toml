[package]
name = "rustleys-whatsapp"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Independent Rust port of Baileys (initial development; not functional yet)"
repository = "https://github.com/JVini0166/rustleys-whatsapp"
publish = false

[lib]
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
prost-reflect = { version = "0.16", features = ["serde"] }

[dependencies]
subtle = "2.6"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3.27"
libc = "0.2"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bytes = "1.12"
wacore-libsignal = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "3f21778971e36f796b41b1180ef04da075968750" }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = "0.12"
getrandom = "0.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }
prost = "0.14"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"
